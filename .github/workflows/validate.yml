name: Validate examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate workflow structure and safety boundaries
        run: python scripts/validate_examples.py
      - name: Check generated retrieval example
        run: python scripts/build_retrieval_example.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test tenant-scoped retrieval logic
        run: node --test tests/tenant_retrieval.test.mjs
